<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATTLESHIP - 80's Arcade Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

  <div id="app">
    <header>
      <h1 class="title glow-text">BATTLESHIP</h1>
      <p class="subtitle">80's ARCADE EDITION</p>
    </header>

    <div id="message-bar">
      <p id="message">WELCOME, COMMANDER. PREPARE FOR BATTLE.</p>
    </div>

    <div id="game-container">
      <div class="board-section">
        <h2 class="board-label glow-cyan">YOUR FLEET</h2>
        <div class="board-wrapper">
          <div class="col-labels" id="player-col-labels"></div>
          <div class="board-row-wrapper">
            <div class="row-labels" id="player-row-labels"></div>
            <div class="board" id="player-board"></div>
          </div>
        </div>
      </div>

      <div id="ship-dock" class="board-section">
        <h2 class="board-label glow-magenta">SHIPS</h2>
        <div id="ship-list"></div>
        <div id="placement-controls">
          <button id="rotate-btn" class="retro-btn">ROTATE [R]</button>
          <button id="random-btn" class="retro-btn">RANDOM</button>
          <button id="clear-btn" class="retro-btn">CLEAR</button>
          <button id="start-btn" class="retro-btn btn-go" disabled>START BATTLE</button>
        </div>
      </div>

      <div class="board-section">
        <h2 class="board-label glow-magenta">ENEMY WATERS</h2>
        <div class="board-wrapper">
          <div class="col-labels" id="enemy-col-labels"></div>
          <div class="board-row-wrapper">
            <div class="row-labels" id="enemy-row-labels"></div>
            <div class="board" id="enemy-board"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="scoreboard">
      <div class="score-item">
        <span class="score-label glow-cyan">YOUR SHIPS</span>
        <span class="score-value" id="player-ships-left">5</span>
      </div>
      <div class="score-item">
        <span class="score-label glow-magenta">ENEMY SHIPS</span>
        <span class="score-value" id="enemy-ships-left">5</span>
      </div>
    </div>

    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="game-over-title" class="glow-text"></h2>
        <p id="game-over-msg"></p>
        <button id="play-again-btn" class="retro-btn btn-go">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
